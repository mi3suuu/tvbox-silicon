name: TVBox
options:
  bundleIdPrefix: com.tvbox
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja]
  deploymentTarget:
    macOS: '15.0'
    iOS: '17.0'
    tvOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # SwiftUI sometimes builds ForEach/LazyVGrid content off the main thread (crash reports from iOS 18,
    # 26 and 27). Swift 6's runtime isolation check then traps in those @MainActor view closures
    # (_dispatch_assert_queue_fail in SitesView/SiteView grids). Swift 5 had no such check, and building
    # a view there is safe, so keep the compile-time checks and drop the runtime trap.
    # https://developer.apple.com/forums/thread/802729
    OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-dynamic-actor-isolation
    MARKETING_VERSION: '1.33.0'
    CURRENT_PROJECT_VERSION: '1330'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 顾及One
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # [mi3s] 签名相关（CODE_SIGN_STYLE / DEVELOPMENT_TEAM /
    # PRODUCT_BUNDLE_IDENTIFIER）**不能写在这里**：xcodegen 会把 target settings
    # 写进 pbxproj 的 buildSettings，其优先级**高于** baseConfigurationReference
    # （已实测：xcconfig 里的 XVPROBE 能读到，但 PRODUCT_BUNDLE_IDENTIFIER 仍被
    # 这里的值盖住）。这些键统一交给 Config/DeviceTest.xcconfig，
    # 由 TVBox-iOS 的 target 级 configFiles 挂载。
    # Config/iCloud.entitlements once the App IDs and profiles have iCloud (Sources/TVCore/CloudSync.swift).
    ICLOUD_ENTITLEMENTS: ''
packages:
  # Symlinks to the root Package.swift, Sources, Vendor and Tests. Xcode walks every file under a
  # local package before building, so pointing it at the repo root made it scan build/ (minutes).
  TVCore:
    path: Packages/TVCore
  # Mac updates (App/MacUpdater.swift). Scripts/make-appcast.sh uses the same version's tools.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # The Mac detail page's aurora backdrop (App/DetailAurora.swift).
  ColorfulX:
    url: https://github.com/Lakr233/ColorfulX
    exactVersion: 6.2.1
targetTemplates:
  SharedApp:
    type: application
    sources:
      - path: App
      # Release notes the website publishes; the bundled copy shows What's New offline.
      - path: website/public/releases.json
        buildPhase: resources
    dependencies:
      - package: TVCore
    info:
      path: Config/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: 顾及One
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # [mi3s] 二开：外置播放器列表（App/ExternalPlayer.swift + Mi3sExternalPlayerMenu）。
        # iOS 的 canOpenURL 只认这里登记过的 scheme，不登记则整个列表恒为空。
        LSApplicationQueriesSchemes: [infuse, vlc-x-callback, nplayer-http, senplayer]
        NSLocalNetworkUsageDescription: Connect to the local media and subscription services you configure, and find Mi3s on your other devices.
        # Play On (Sources/TVCore/PlayOn.swift): iOS browses and advertises only the Bonjour types listed here.
        NSBonjourServices: [_yingxia._tcp]
        UILaunchScreen: {}
        # 与上游（GitHub `jo32/tvbox-silicon` main）一致：**只要 `audio`**。
        #
        # 曾误以为 PiP 需要额外的 `picture-in-picture` 后台模式，加进去后发现
        # 上游没有它照样能「返回主屏出浮窗」。真正的开关是
        # `AVPictureInPictureController.canStartPictureInPictureAutomaticallyFromInline`，
        # 不是这个 plist 键。加多余的后台模式只会扩大审核面，不解决任何问题。
        UIBackgroundModes: [audio]
targets:
  TVBox-macOS:
    templates: [SharedApp]
    platform: macOS
    sources:
      - path: App
      - path: Config/macOS/Assets.xcassets
      # Artwork of the icons in Settings › App Icon, drawn as the Dock icon (Design/make-app-icons.swift).
      - path: Config/AppIcons.xcassets
      - path: build/ScriptHost
        type: folder
        buildPhase: resources
      - path: build/PythonHost
        type: folder
        buildPhase: resources
      - path: build/JavaHost
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Embed Dandanplay API configuration
        script: '"$SRCROOT/Scripts/embed-dandanplay-config.py"'
        basedOnDependencyAnalysis: false
      - name: Check the bundled Java host
        script: '"$SRCROOT/Scripts/check-java-host.sh" "$SRCROOT/build/JavaHost/host.jar" && touch "$DERIVED_FILE_DIR/java-host-checked"'
        # Declared, so the script sandbox lets it read them and it runs again only when one changes.
        inputFiles:
          - $(SRCROOT)/Scripts/check-java-host.sh
          - $(SRCROOT)/Runtime/JavaHost/src/main/java/tvbox/runtime/BytecodeCompatibility.java
          - $(SRCROOT)/build/JavaHost/host.jar
        outputFiles:
          - $(DERIVED_FILE_DIR)/java-host-checked
    dependencies:
      - package: Sparkle
      - package: ColorfulX
    info:
      properties:
        # yingxia://import, the link a web page uses to hand over a subscription (#167). The same scheme
        # carries the Douyin sign-in on iPhone, where the target below registers it.
        CFBundleURLTypes:
          - CFBundleURLName: com.tvbox.yingxia.handoff
            CFBundleURLSchemes: [yingxia]
        # Open With: a .json, .m3u, .txt, .py or .js file opens as a subscription (#983, App/TVBoxApp.swift).
        # Alternate, so Yingxia is offered but never becomes the default app for these types.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Subscription File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.m3u-playlist, public.plain-text, public.python-script, com.netscape.javascript-source]
        # Sparkle (App/MacUpdater.swift) picks the appcast for the package in code. Every update must be signed
        # with this key (private half: ~/.sparkle/yingxia_ed25519.key on the release Mac), and so must the appcast.
        SUPublicEDKey: GH90e0snzIFHgk1wn+91KyrD6jbOnOu7sC7GJPWdG6c=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo32.yingxia.mac
      CODE_SIGN_ENTITLEMENTS: $(ICLOUD_ENTITLEMENTS)
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TVBox-iOS:
    templates: [SharedApp]
    # [mi3s] 真机签名 —— target 级 xcconfig（只挂 TVBox-iOS 一个 target）。
    # 不能用命令行 `-xcconfig`：那是全局的，会把 PROVISIONING_PROFILE_SPECIFIER
    # 注入 SwiftPM 包 target TVCore_TVCore，包 target 不接受描述文件 → BUILD FAILED。
    configFiles:
      Debug: Config/DeviceTest.xcconfig
    preBuildScripts:
      - name: Embed Dandanplay API configuration
        script: '"$SRCROOT/Scripts/embed-dandanplay-config.py"'
        basedOnDependencyAnalysis: false
    platform: iOS
    sources:
      - path: Runtime/AppleRuntime/Native/AppleRuntime.m
      # Python sources: opens the CPython that the embed step below adds (Scripts/build-apple-python.sh).
      - path: Runtime/AppleRuntime/Native/ApplePython.c
      # App icons, Classic (the app's own) and the alternates Settings › App Icon offers, from
      # Design/make-app-icons.swift. Classic's dark and tinted versions are generated by Design/make-ios-icon.swift.
      - path: Config/iOS/Assets.xcassets
      # The same icons' artwork for the picker.
      - path: Config/AppIcons.xcassets
      - path: Config/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    postBuildScripts:
      - name: Embed on-device Java runtime
        script: |
          set -eu
          RUNTIME="$SRCROOT/build/AppleRuntime/$PLATFORM_NAME"
          test -f "$RUNTIME/lib/libTVAppleRuntime.a"
          "$SRCROOT/Scripts/check-java-host.sh" "$RUNTIME/Resources/JavaHost/host.jar"
          rsync -a --delete "$RUNTIME/Resources/lib/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/"
          rsync -a --delete "$RUNTIME/Resources/JavaHost/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/JavaHost/"
        basedOnDependencyAnalysis: false
      - name: Embed on-device Python runtime
        script: '"$SRCROOT/Scripts/embed-apple-python.sh"'
        basedOnDependencyAnalysis: false
      - name: Embed on-device Node runtime
        script: '"$SRCROOT/Scripts/embed-node-mobile.sh"'
        basedOnDependencyAnalysis: false
    settings:
      HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/include
      # ★ InjectionIII 热重载（仅 Debug）：-interposable 让注入的 dylib 能替换已加载实现。
      #   EMIT_FRONTEND_COMMAND_LINES=YES 让 Xcode 27 记录 swift-frontend 调用行
      #   （Xcode 16.3 起默认不记录，InjectionIII 靠它重编译单文件）。
      OTHER_LDFLAGS: $(inherited) -Wl,-force_load,$(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/lib/libTVAppleRuntime.a -Wl,-export_dynamic -lc++ -lz -liconv -framework Security -framework CoreGraphics -Xlinker -interposable
      EMIT_FRONTEND_COMMAND_LINES: YES
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # ★ 2026-11-12：Preview 需要 YES，而内嵌 JVM 需要 NO（b5d50c7 关的：
      #   debug dylib 会把主二进制包成 .debug.dylib，JVM 的 dlsym 找不到符号）。
      # 两者不冲突：Preview 只在**模拟器**跑，JVM 只在**真机**的 Java 插件里用。
      #   · iphonesimulator → YES（SwiftUI Preview 必需）
      #   · iphoneos       → NO（保持 JVM 可用）
      ENABLE_DEBUG_DYLIB[sdk=iphonesimulator*]: YES
      ENABLE_DEBUG_DYLIB[sdk=iphoneos*]: NO
      # An archive (TestFlight) strips every symbol by default, but the embedded JVM looks up its jimage
      # and JNI entry points with dlsym; keep the global ones that -export_dynamic exports.
      STRIP_STYLE: non-global
      ARCHS: arm64
      # [mi3s] 二开：Web Cast（内嵌 Web 服务器 + 设置页）。关掉即整包不含该能力。
      # DEBUG 显式列出，否则 xcodegen 内建的 Debug 值会覆盖 target 级设置、把 WEBCAST 丢掉。
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG WEBCAST
      # [mi3s] 真机测试专用 bundle id 不要写死在这里 —— 写死会让 xcodegen generate 后
      # 出来的「正式 / TestFlight」包也带测试 id。测试 id（wda.prdc.yingxia.guji）放到
      # Config/DeviceTest.xcconfig，由 Scripts/install-duo-test.sh 用 -xcconfig 注入。
      # 设备上已有的 wda.prdc.yingxia.dev 是另一 Team (G4XMHC9NWZ) 签的，application-identifier
      # 不同，iOS 拒绝就地升级（MismatchedApplicationIdentifierEntitlement），所以测试必须换 id。
      # PRODUCT_BUNDLE_IDENTIFIER 交给 Config/DeviceTest.xcconfig（见上）。
      CODE_SIGN_ENTITLEMENTS: $(ICLOUD_ENTITLEMENTS)
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Keep in step with AppIconChoice (App/AppIcons.swift).
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-MediaPocketGray AppIcon-MediaLayers AppIcon-PlayTriangle AppIcon-SealMusic AppIcon-ShibaManga AppIcon-CatCinema AppIcon-AnimalTrio AppIcon-Panda AppIcon-Arc AppIcon-Classic AppIcon-Aurora AppIcon-Porcelain AppIcon-Obsidian AppIcon-Azure AppIcon-Daybreak AppIcon-Iris AppIcon-Lagoon AppIcon-RoseQuartz AppIcon-Citrus AppIcon-Cosmic
      TARGETED_DEVICE_FAMILY: '1,2'
    info:
      properties:
        ITSAppUsesNonExemptEncryption: false
        # [mi3s] 二开：内嵌 Web Cast 服务器默认端口（仅在 WEBCAST 编译开关下生效）。
        WebCastDefaultPort: 8090
        # [mi3s] 二开：从视频自带音轨生成语音字幕（Sources/TVCore/SpeechSubtitles.swift）。识别在本机进行。
        NSSpeechRecognitionUsageDescription: Writes subtitles from a video's own sound track, on this device.
        # Let UIKit and Core Animation use ProMotion rates during gestures and transitions.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Save Code to Photos, where a sign-in code can be scanned by the app on the same phone.
        NSPhotoLibraryAddUsageDescription: Saves a sign-in code to Photos, so the app on this phone can scan it.
        # Downloads keep going in the background as continued-processing tasks (iOS 26, App/DownloadsView.swift).
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).downloads.*]
        # The video plays on a connected display (App/ExternalDisplay.swift). iOS 27 also needs the scene
        # accessory the player screen registers; earlier systems offer the scene from this role alone.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: ExternalDisplaySceneDelegate
        # yingxia://douyin-login, the code an Apple TV shows to receive the Douyin sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: com.tvbox.yingxia.handoff
            CFBundleURLSchemes: [yingxia]
        # The share sheet and Open In: a .json, .m3u, .txt, .py or .js file opens as a subscription (#983,
        # App/TVBoxApp.swift). Alternate, so Yingxia is offered but never becomes the default app for these types;
        # in place, so the app copies the file itself and Open In leaves no copy in Documents/Inbox.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Subscription File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.m3u-playlist, public.plain-text, public.python-script, com.netscape.javascript-source]
        LSSupportsOpeningDocumentsInPlace: true
  TVBox-tvOS:
    templates: [SharedApp]
    preBuildScripts:
      - name: Embed Dandanplay API configuration
        script: '"$SRCROOT/Scripts/embed-dandanplay-config.py"'
        basedOnDependencyAnalysis: false
    platform: tvOS
    sources:
      - path: Runtime/AppleRuntime/Native/AppleRuntime.m
      # Python sources: opens the CPython that the embed step below adds (Scripts/build-apple-python.sh).
      - path: Runtime/AppleRuntime/Native/ApplePython.c
      # Layered app icon, its alternates and the top shelf images, generated by Design/make-tvos-icon.swift.
      - path: Config/tvOS/Assets.xcassets
      # The icons' artwork for Settings › App Icon and AppMark.
      - path: Config/AppIcons.xcassets
      - path: Config/tvOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    postBuildScripts:
      - name: Embed on-device Java runtime
        script: |
          set -eu
          RUNTIME="$SRCROOT/build/AppleRuntime/$PLATFORM_NAME"
          test -f "$RUNTIME/lib/libTVAppleRuntime.a"
          "$SRCROOT/Scripts/check-java-host.sh" "$RUNTIME/Resources/JavaHost/host.jar"
          rsync -a --delete "$RUNTIME/Resources/lib/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/"
          rsync -a --delete "$RUNTIME/Resources/JavaHost/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/JavaHost/"
        basedOnDependencyAnalysis: false
      - name: Embed on-device Python runtime
        script: '"$SRCROOT/Scripts/embed-apple-python.sh"'
        basedOnDependencyAnalysis: false
    settings:
      HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/include
      OTHER_LDFLAGS: $(inherited) -Wl,-force_load,$(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/lib/libTVAppleRuntime.a -Wl,-export_dynamic -lc++ -lz -liconv -framework Security -framework CoreGraphics
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ENABLE_DEBUG_DYLIB: NO
      # An archive (TestFlight) strips every symbol by default, but the embedded JVM looks up its jimage
      # and JNI entry points with dlsym; keep the global ones that -export_dynamic exports.
      STRIP_STYLE: non-global
      ARCHS: arm64
      PRODUCT_BUNDLE_IDENTIFIER: com.jo32.yingxia.tv
      CODE_SIGN_ENTITLEMENTS: $(ICLOUD_ENTITLEMENTS)
      ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
    info:
      properties:
        ITSAppUsesNonExemptEncryption: false
        # The alternate icons (Settings › App Icon), image stacks in Config/tvOS/Assets.xcassets. tvOS takes them as an
        # array of names. ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES would make actool write iOS's dictionary form,
        # which App Store Connect refuses for tvOS (ITMS-90471, "missing the Alternate Icon asset").
        # Keep in step with AppIconChoice (App/AppIcons.swift) and the iOS list above.
        CFBundleIcons:
          CFBundleAlternateIcons: [AppIcon-MediaPocketGray, AppIcon-MediaLayers, AppIcon-PlayTriangle, AppIcon-SealMusic, AppIcon-ShibaManga, AppIcon-CatCinema, AppIcon-AnimalTrio, AppIcon-Panda, AppIcon-Arc, AppIcon-Classic, AppIcon-Aurora, AppIcon-Porcelain, AppIcon-Obsidian, AppIcon-Azure, AppIcon-Daybreak, AppIcon-Iris, AppIcon-Lagoon, AppIcon-RoseQuartz, AppIcon-Citrus, AppIcon-Cosmic]
